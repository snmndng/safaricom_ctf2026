<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orchard Society</title><style>*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:repeating-radial-gradient(circle at 95% 5%,transparent 0 60px,#8888880c 60px 62px),#071f19;color:#f3ffed;font:16px/1.7 Verdana,sans-serif;padding:clamp(20px,4vw,60px)}main{max-width:1150px;margin:auto}header{display:flex;justify-content:space-between;border-bottom:1px solid #b7ed7166;padding:0 0 20px;font-size:12px;letter-spacing:.15em}.hero{padding:clamp(30px,6vw,80px) 0;max-width:950px}.eyebrow{color:#b7ed71;text-transform:uppercase;font-size:12px;letter-spacing:.2em}h1,h2{font-family:Arial Black,sans-serif;line-height:1.08}h1{font-size:clamp(42px,8vw,102px);letter-spacing:-.045em;margin:20px 0}.lead{font-size:21px;max-width:660px;opacity:.85}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}section.card{background:#143d30;padding:30px;border:1px solid #b7ed7144;border-radius:4px}h2{font-size:28px;margin:0 0 20px}a{color:#b7ed71;text-underline-offset:5px}.download{display:block;padding:14px 0;border-bottom:1px solid #b7ed7133;overflow-wrap:anywhere}input,textarea,select{width:100%;font:inherit;background:#071f19;color:#f3ffed;border:1px solid #b7ed7188;padding:13px;border-radius:6px;margin:8px 0 14px}textarea{min-height:135px}button{background:#b7ed71;color:#071f19;border:0;border-radius:6px;padding:13px 22px;font:700 15px Verdana,sans-serif;cursor:pointer}pre{background:#071f19;white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;border-radius:6px;max-height:420px;overflow:auto}small{opacity:.75}details{margin:20px 0}summary{cursor:pointer}footer{margin-top:40px;font-size:12px;opacity:.6}:focus-visible{outline:3px solid #b7ed71;outline-offset:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{gap:15px}h1{overflow-wrap:anywhere}.card{min-width:0}}</style></head><body><main><header><span>ORCHARD SOCIETY</span><span>COMMUNITY GARDEN</span></header><div class="hero"><div class="eyebrow">An ordinary day / A different story</div><h1>Orchard Society</h1><p class="lead">The orchard is open for another season.</p></div><div class="grid"><section class="card"><h2>Collection desk</h2><p>Materials for your visit are available below.</p><a class="download" href="/downloads/orchard-export.zip">orchard-export.zip</a></section><section class="card"><h2>Leave a receipt</h2><form id="desk"><label for="answer">Collection receipt</label><input id="answer" name="answer" autocomplete="off" required><button>Send</button></form><pre id="out" aria-live="polite">The desk is open.</pre></section></div><footer>Orchard Society · Open for the evening</footer></main><script>document.querySelector('form')?.addEventListener('submit',async e=>{e.preventDefault();let out=document.getElementById('out');try{let consoleMode=e.target.id==='console';let path=consoleMode?document.getElementById('path').value:'/submit';if(!path.startsWith('/')||path.startsWith('//'))throw Error('Use a local service path.');let method=consoleMode?document.getElementById('method').value:'POST';let headers=consoleMode?JSON.parse(document.getElementById('headers').value):{};headers['Content-Type']='application/json';let body=consoleMode?document.getElementById('body').value:JSON.stringify({answer:document.getElementById('answer').value});let r=await fetch(path,{method,headers,...(method==='GET'?{}:{body})});out.textContent=await r.text();}catch(e){out.textContent='Please check the request and try again.'}});</script></body></html>
